# API keys belong in environment variables, never in this file.
version = 1

[scan]
concurrency = 3
timeout_seconds = 600
max_output_bytes = 4194304
# Additional exclusions; built-in sensitive-file exclusions still apply.
excludes = ["vendor", "dist", "coverage"]

[providers.router]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
api_format = "openai-chat"

[[models]]
id = "reviewer-a"
provider = "router"
model = "replace-with-available-model-id"
agent = "opencode"

# Add another model to run another independent review:
# [[models]]
# id = "reviewer-b"
# provider = "router"
# model = "replace-with-another-model-id"
# agent = "opencode"

[agents.opencode]
command = ["opencode"]

