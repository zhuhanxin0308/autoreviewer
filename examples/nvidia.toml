# NVIDIA OpenAI-compatible endpoint. Set NVIDIA_API_KEY in your environment.
# Do not write the API key into this file.
# Tested combination: OpenCode 1.2.27 + openai/gpt-oss-20b, synthetic fixture only.
# See docs/live-tests/nvidia-2026-10-22.md for scope and failed attempts.
version = 1

[scan]
concurrency = 2
timeout_seconds = 180

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
api_format = "openai-chat"

[agents.opencode]
command = ["opencode"]

[[models]]
id = "nvidia-gpt-oss"
provider = "nvidia"
model = "openai/gpt-oss-20b"
agent = "opencode"

# Optional second model: a single-model retry passed the same synthetic audit.
# Its first full audit failed output file-path validation. Stability is unverified.
# GPT-OSS passed in a partial parallel batch; Nemotron passed in a later solo retry.
# No fully successful parallel live report has been observed yet.
# Uncomment only when you intend to test this additional model.
