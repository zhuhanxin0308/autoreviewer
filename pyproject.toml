[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreviewer"
version = "0.1.0"
description = "Parallel code security reviews with locally installed coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["security", "code-review", "agents", "cli"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
autoreviewer = "autoreviewer.cli:main"

[project.optional-dependencies]
browser-tests = ["playwright>=1.40,<2"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoreviewer = [
    "default.toml", "static/*.html", "static/*.js", "static/*.css",
    "audit_guidance/cloudflare/*.md", "audit_guidance/cloudflare/*.json",
    "audit_guidance/cloudflare/upstream/*",
    "audit_guidance/cloudflare/upstream/skills/security-audit/*",
]
