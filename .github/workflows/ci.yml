name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run unit and fixture integration tests
        run: python -m unittest discover -s tests -v
      - name: Check command entry point
        run: autoreviewer --help

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: python -m pip install '.[browser-tests]'
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Exercise local UI with fixture CLIs and mocked GitHub
        run: python tests/browser_smoke.py
      - name: Check multi-tab, keyboard and evidence review regressions
        run: python tests/browser_regressions.py
